[project]
name = "telco-digital"
version = "0.1.0"
description = "Shared intelligence POC — PostgreSQL system of record, Neo4j projection, temporal digital twins."
authors = [
    {name = "Pamudu", email = "pamudu123456789@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "neo4j (>=5.27.0,<7.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.3.0,<10.0.0)",
    "pytest-asyncio (>=0.25.0,<2.0.0)",
    "ruff (>=0.9.0,<1.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
]
api = [
    "httpx (>=0.28.0,<1.0.0)",
]
ml = [
    "scikit-learn (>=1.6.0,<2.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
]
notebooks = [
    "jupyterlab (>=4.4.0,<5.0.0)",
    "nbconvert (>=7.16.0,<8.0.0)",
    "ipykernel (>=6.29.0,<8.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "seaborn (>=0.13.0,<1.0.0)",
]

[tool.poetry]
packages = [{include = "telco_digital", from = "src"}]

[tool.vercel]
entrypoint = "src.telco_digital.api.app:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: requires PostgreSQL",
    "scenario: end-to-end behavioural proofs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/telco_digital/api/**" = ["B008"]
"notebooks/01_graph_projection/*.ipynb" = ["E402", "E501"]
"notebooks/03_event_memory/*.ipynb" = ["E402", "E501"]
"notebooks/04_behaviour/*.ipynb" = ["E402", "E501"]
